<!DOCTYPE html>
<html>
  <head>
    <title>Upload Image & Create Doc</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        max-width: 500px;
        margin: auto;
      }
      input,
      button,
      textarea {
        margin: 10px 0;
        padding: 10px;
        width: 100%;
      }
      #preview {
        margin-top: 20px;
        text-align: center;
      }
      img {
        max-width: 100%;
        border: 1px solid #ccc;
        padding: 5px;
        border-radius: 5px;
      }
      .result-box {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        background: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Upload Image → Save to Drive & Docs</h2>
      <textarea
        id="questionInput"
        placeholder="Type your question here"
      ></textarea>
      <input
        type="file"
        accept="image/*"
        id="cmUploadControl"
        onchange="cmFetchFile()"
      />
      <button onclick="uploadData()">Upload & Create Doc</button>
      <div id="preview"></div>
    </div>

    <script>
      let selectedfile;
      let selectedFile64String;

      function cmFetchFile() {
        const fileInput = document.getElementById("cmUploadControl");
        const files = fileInput.files;

        if (files.length > 0) {
          selectedfile = files[0];
          const reader = new FileReader();

          reader.onload = function (event) {
            selectedFile64String = event.target.result;
            document.getElementById(
              "preview"
            ).innerHTML = `<img src="${selectedFile64String}" alt="Preview Image">`;
          };

          reader.readAsDataURL(selectedfile);
        } else {
          console.log("No file selected");
        }
      }

      function uploadData() {
        const questionText = document.getElementById("questionInput").value;

        if (!selectedFile64String) {
          alert("Please select an image first!");
          return;
        }

        const saveRequest = {
          apiType: "TESTING_IMAGEDOC",
          selectedFileType: selectedfile?.type,
          selectedFileName: selectedfile?.name,
          selectedFile64String: selectedFile64String,
          docTitle: "Test Document from App",
          questionText: questionText, // ✅ textarea का text भी भेजा
        };

        fetch(
          "https://script.google.com/macros/s/AKfycbztRT61BtnaLpEOcE9nghNdMz5rm-l8Oi8xbNhEO50V9TvrZBNtR_JE9h6hJxSqurx-Dw/exec",
          {
            method: "POST",
            body: JSON.stringify(saveRequest),
          }
        )
          .then((res) => res.json())
          .then((data) => {
            if (data.status === "success") {
              document.getElementById("preview").innerHTML = `
                <div class="result-box">
                  <p><b>Qno :-</b></p>
                  ${
                    data.imageUrl
                      ? `<p><img src="${data.imageUrl}" alt="Uploaded Image"></p>`
                      : ""
                  }
                  ${
                    questionText
                      ? `<p style="text-align:left;">${questionText}</p>`
                      : ""
                  }
                  <p><a href="${
                    data.docUrl
                  }" target="_blank">📄 View Google Doc</a></p>
                </div>`;
            } else {
              alert("Upload failed!");
            }
          })
          .catch((err) => console.error(err));
      }
    </script>
  </body>
</html>
