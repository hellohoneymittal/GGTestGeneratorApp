<!DOCTYPE html>
<html>
  <head>
    <title>Student Timers</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f4f4f4;
      }
      .student {
        background: #fff;
        border-radius: 8px;
        padding: 15px;
        margin: 10px 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .student h3 {
        margin: 0 0 10px;
      }
      .timer {
        font-size: 1.5em;
        margin-bottom: 10px;
      }
      button {
        padding: 8px 14px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background: #4caf50;
        color: white;
      }
      button.stop {
        background: #f44336;
      }
    </style>
  </head>
  <body>
    <h1>Student Timers</h1>
    <div id="students"></div>

    <script>
      const studentNames = ["Aman", "Priya", "Rahul", "Sneha", "Karan"];
      const container = document.getElementById("students");

      studentNames.forEach((name) => {
        const studentDiv = document.createElement("div");
        studentDiv.className = "student";

        const title = document.createElement("h3");
        title.textContent = name;
        studentDiv.appendChild(title);

        const timerDisplay = document.createElement("div");
        timerDisplay.className = "timer";
        timerDisplay.textContent = "00:00:000";
        studentDiv.appendChild(timerDisplay);

        const toggleBtn = document.createElement("button");
        toggleBtn.textContent = "Start";
        studentDiv.appendChild(toggleBtn);

        container.appendChild(studentDiv);

        let startTime = null;
        let timerInterval = null;
        let elapsed = 0;

        function updateDisplay() {
          const time = elapsed + (Date.now() - startTime);
          const minutes = Math.floor(time / 60000);
          const seconds = Math.floor((time % 60000) / 1000);
          const milliseconds = time % 1000;

          timerDisplay.textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0") +
            ":" +
            String(milliseconds).padStart(3, "0");
        }

        toggleBtn.addEventListener("click", () => {
          if (!timerInterval) {
            // Start timer
            startTime = Date.now();
            timerInterval = setInterval(updateDisplay, 10);
            toggleBtn.textContent = "Stop";
            toggleBtn.classList.add("stop");
          } else {
            // Stop timer
            elapsed += Date.now() - startTime;
            clearInterval(timerInterval);
            timerInterval = null;
            toggleBtn.textContent = "Start";
            toggleBtn.classList.remove("stop");
          }
        });
      });
    </script>
  </body>
</html>
